name: Reusable CI

on:
  workflow_call:

    inputs:
      app_name:
        description: "Application name"
        required: true
        type: string

      run_lint:
        description: "Run linting"
        required: false
        type: boolean
        default: true

    secrets:
      DEMO_SECRET:
        description: "Demo secret"
        required: true
        
      SONAR_TOKEN:
        required: false

jobs:

  testjob:
    needs: lint
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: |
          echo "Hello from reusable workflow"
          echo "Repository: ${{ github.repository }}"

      - name: Show inputs
        run: |
          echo "Application: ${{ inputs.app_name }}"
          echo "Run Lint: ${{ inputs.run_lint }}"

      - name: Run basic test
        run: |
          echo "Reusable workflow is working"
          echo "Application = ${{ inputs.app_name }}"

      - name: Demo secret
        run: |
          echo "Secret is available"


  lint:
    if: ${{ inputs.run_lint }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .
