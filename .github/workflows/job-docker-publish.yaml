
name: Job Docker Publish

on:
  workflow_call:
    inputs:
      service_name:
        description: "Application service name"
        required: true
        type: string

      image_name:
        description: "Full Docker image name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        type: string
      
      registry:
        description: "Container registry"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  docker-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.service_name }}
          path: /tmp/docker-image

      - name: Load Docker image
        run: |
          docker load -i /tmp/docker-image/image.tar

    #   - name: Login to GHCR
    #     uses: docker/login-action@v3
    #     with:
    #       registry: ghcr.io
    #       username: ${{ github.actor }}
    #       password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
            registry: ${{ inputs.registry }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push "${{ inputs.image_name }}:${{ inputs.image_tag }}"

      - name: Display published image
        run: |
          echo "Successfully published:"
          echo "${{ inputs.image_name }}:${{ inputs.image_tag }}"
