
name: Job Docker Smoke Test

on:
  workflow_call:
    inputs:
      service_name:
        description: "Application service name"
        required: true
        type: string

      image_name:
        description: "Docker image name"
        required: true
        type: string

      image_tag:
        description: "Docker image tag"
        required: true
        type: string

      container_port:
        description: "Application container port"
        required: true
        type: number

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ inputs.service_name }}
          path: /tmp/docker-image

      - name: Load Docker image
        run: docker load -i /tmp/docker-image/image.tar

      - name: Start application container
        run: |
          docker run -d \
            --name smoke-test \
            -p ${{ inputs.container_port }}:${{ inputs.container_port }} \
            ${{ inputs.image_name }}:${{ inputs.image_tag }}

      - name: Wait for application
        run: sleep 5

      - name: Test health endpoint
        run: |
          curl --fail \
            http://localhost:${{ inputs.container_port }}/

      - name: Display container logs
        if: always()
        run: docker logs smoke-test || true

      - name: Cleanup container
        if: always()
        run: docker rm -f smoke-test || true
