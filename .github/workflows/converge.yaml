
name: Converge

on:
  workflow_call:
    inputs:
      service_name:
        description: "Application service name"
        required: true
        type: string

      dockerfile:
        description: "Dockerfile path"
        required: true
        type: string

      context:
        description: "Docker build context"
        required: true
        type: string

      image_name:
        description: "Full container image name"
        required: true
        type: string

      image_tag:
        description: "Container image tag"
        required: true
        type: string

      container_port:
        description: "Application container port"
        required: true
        type: number

      registry:
        description: "Container registry"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:

  # ---------------- INFO ----------------

  info:
    uses: abhishekg2244/cc-org-shared-workflows/.github/workflows/job-info.yaml@main
    with:
      workflow_ref: ${{ github.workflow_ref }}
      config: ci/converge.yml

  # ---------------- BUILD ----------------

  build:
    needs: info
    uses: abhishekg2244/cc-org-shared-workflows/.github/workflows/job-docker-build.yaml@main
    with:
      service_name: ${{ inputs.service_name }}
      dockerfile: ${{ inputs.dockerfile }}
      context: ${{ inputs.context }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}

  # ---------------- SCAN ----------------

  scan:
    needs: build
    uses: abhishekg2244/cc-org-shared-workflows/.github/workflows/job-docker-scan.yaml@main
    with:
      service_name: ${{ inputs.service_name }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}

  # ---------------- PUBLISH ----------------

  publish:
    needs: scan
    uses: abhishekg2244/cc-org-shared-workflows/.github/workflows/job-docker-publish.yaml@main
    with:
      service_name: ${{ inputs.service_name }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      registry: ${{ inputs.registry }}

  # ---------------- SMOKE TEST ----------------

  smoke:
    needs: publish
    uses: abhishekg2244/cc-org-shared-workflows/.github/workflows/job-docker-smoke.yaml@main
    with:
      service_name: ${{ inputs.service_name }}
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      container_port: ${{ inputs.container_port }}
